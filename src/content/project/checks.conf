# PAACM check manifest: tier|label|command
#
# Tiers run cumulatively: --tier quick runs quick; --tier full runs quick and full;
# --tier security runs all three. The gate fails closed: a tier the task needs
# but that has no checks makes `paacm gate` exit 3.
#
# This file is executable code. Review every command before running it, and
# keep it under review in pull requests. `paacm detect` proposes commands found
# in this repository (package.json scripts, Makefile targets, pyproject, Cargo,
# go.mod); copy the ones you trust here.
#
# Examples (remove the leading "# " to enable):
# quick|lint|npm run lint
# quick|typecheck|npx tsc --noEmit
# quick|unit-tests|npm test
# full|build|npm run build
# full|integration-tests|npm run test:integration
# security|audit|npm audit --audit-level=high

quick|diff-whitespace|git diff --check HEAD
