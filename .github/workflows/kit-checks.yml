name: Kit smoke checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n scripts/agent-check scripts/install-to-project.sh
      - name: Run configured quick checks
        run: sh scripts/agent-check --quick
      - name: Test installer dry-run, apply, and conflict refusal
        shell: bash
        run: |
          set -euo pipefail
          tempdir=$(mktemp -d)
          trap 'rm -rf "$tempdir"' EXIT
          mkdir "$tempdir/project"
          sh scripts/install-to-project.sh "$tempdir/project" --dry-run
          test ! -e "$tempdir/project/AGENTS.md"
          sh scripts/install-to-project.sh "$tempdir/project" --apply
          cmp AGENTS.md "$tempdir/project/AGENTS.md"
          printf 'local policy\n' > "$tempdir/project/AGENTS.md"
          if sh scripts/install-to-project.sh "$tempdir/project" --apply; then
            echo "Expected installer to refuse conflict" >&2
            exit 1
          fi
